[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mapalign"
version = "0.1.0"
description = "Feature-based georeferencing of historical Survey of India maps: a reproducible baseline comparison"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
# torch is listed without a build tag. Install the CPU or CUDA wheel explicitly
# from the PyTorch index first (see README), then install this package.
dependencies = [
    "torch>=2.2",
    "kornia>=0.7.2",
    "opencv-python-headless>=4.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pillow>=10.2",
    "rasterio>=1.3.9",
    "pyproj>=3.6",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "requests>=2.31",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ipykernel>=6.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
